<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zama Project — Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --card-bg: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
    }
    body{
      font-family: Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      background: radial-gradient(ellipse at top left, #071029 0%, #0f172a 40%, #071029 100%);
      color: #e6eef8;
      padding:24px;
    }
    .container{ width:100%; max-width:820px; }
    .hero {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:16px; padding:28px;
      box-shadow: 0 8px 30px rgba(4,6,15,0.6);
      border: 1px solid rgba(255,255,255,0.03);
    }
    .title { font-size:1.375rem; font-weight:700; margin-bottom:6px; color:#fff; }
    .subtitle { color:rgba(230,238,248,0.8); margin-bottom:18px; }
    .start-row { display:flex; gap:12px; align-items:center; margin-top:6px; }
    .btn { cursor:pointer; border-radius:999px; padding:12px 22px; font-weight:700; border:none; }
    .btn-primary { background:#f59e0b; color:#07112b; box-shadow: 0 6px 20px rgba(240,154,11,0.16); }
    .card { margin-top:18px; background: var(--card-bg); border-radius:14px; padding:22px; }
    .q-title { font-size:1.125rem; font-weight:700; margin-bottom:12px; color:#e9f2ff; }
    .options { display:flex; flex-direction:column; gap:12px; }
    .option-btn {
      text-align:left; padding:14px 16px; border-radius:12px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.03);
      cursor:pointer; transition: all .15s ease;
    }
    .option-btn:hover { transform:translateY(-3px); box-shadow: 0 8px 20px rgba(2,6,23,0.4); }
    .option-btn.selected { border-color: rgba(99,102,241,0.9); background: rgba(99,102,241,0.06); }
    .progress-wrap { height:8px; background: rgba(255,255,255,0.03); border-radius:999px; overflow:hidden; margin-bottom:12px; }
    .progress-bar { height:100%; background: linear-gradient(90deg,#3b82f6,#6366f1); width:0%; transition:width .25s ease; }
    .center-row { display:flex; justify-content:center; margin-top:18px; }
    .meta { color: rgba(230,238,248,0.7); font-size:0.92rem; margin-top:14px; display:flex; justify-content:space-between; align-items:center; }
    .footer-badge { position:fixed; left:0; right:0; bottom:14px; display:flex; justify-content:center; pointer-events:none; }
    .badge { background: rgba(255,255,255,0.03); color:#eaf2ff; padding:8px 14px; border-radius:999px; pointer-events:auto; border:1px solid rgba(255,255,255,0.03); }
    /* responsive tweaks */
    @media (max-width:520px){
      .title { font-size:1.125rem; }
      .btn { padding:10px 18px; font-size:0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- FRONT / HOME -->
    <div id="home" class="hero">
      <div style="display:flex; gap:14px; align-items:center;">
        <div style="width:56px; height:56px; border-radius:12px; background:linear-gradient(180deg,#7c3aed,#3b82f6); display:flex; align-items:center; justify-content:center; font-weight:800; color:white; font-size:20px;">Z</div>
        <div>
          <div class="title">Zama Project — Quiz</div>
          <div class="subtitle">Quick quiz on Zama, FHE, and the Creator Program. Answers are hidden until the end — test your knowledge.</div>
        </div>
      </div>

      <div class="start-row">
        <button id="start-btn" class="btn btn-primary">Start Quiz</button>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz" class="card" style="display:none;">
      <div class="progress-wrap" aria-hidden="true"><div id="progressBar" class="progress-bar"></div></div>

      <div id="q-area">
        <div id="q-title" class="q-title">Q1. Question text goes here</div>

        <div id="options" class="options">
          <!-- option buttons appended here -->
        </div>

        <div class="center-row">
          <button id="nextBtn" class="btn btn-primary" disabled>Next ➜</button>
        </div>

        <div class="meta">
          <div id="qcount">Question 1 / 20</div>
          <div id="scoreHint" style="opacity:0.85">Answers will be shown at the end</div>
        </div>
      </div>
    </div>

    <!-- RESULT -->
    <div id="result" class="card" style="display:none;">
      <div class="q-title">Quiz Complete 🎉</div>
      <p id="resultText" style="font-size:1rem; margin-bottom:12px; color:#eaf2ff;">Your Score: 0 / 20</p>

      <div style="display:flex; gap:10px; flex-direction:column;">
        <button id="revealBtn" class="btn" style="background:#ef4444; color:white;">Show All Answers</button>
        <button id="retryBtn" class="btn btn-primary">Restart Quiz</button>
        <a href="https://guild.xyz/zama/creator-program" target="_blank" class="btn" style="background:#10b981; color:white; text-align:center; text-decoration:none;">Join Zama Creator Program</a>
      </div>

      <div id="allAnswers" style="margin-top:14px; display:none; color:rgba(230,238,248,0.95); font-size:0.95rem; max-height:320px; overflow:auto; padding-top:10px;"></div>
    </div>
  </div>

  <div class="footer-badge">
    <div class="badge">Build by Rubel</div>
  </div>

  <script>
    // FULL 20 QUESTIONS (15 original-style + 5 new S5 questions)
    const quizData = [
      // --- ORIGINAL 15 (example set) ---
      { q: "What is Zama known for?", a: ["Fully Homomorphic Encryption (FHE)", "Blockchain Mining", "NFT Minting", "Game Development"], c: 0 },
      { q: "Which programming language is mainly used in TFHE.rs?", a: ["Python", "Rust", "C++", "Go"], c: 1 },
      { q: "Zama focuses on which technology area?", a: ["Privacy-preserving computation", "Cloud Storage", "Social Media", "Quantum Computing"], c: 0 },
      { q: "Concrete ML is built for which purpose?", a: ["Encrypted Machine Learning", "Game Design", "NFT Art", "Data Storage"], c: 0 },
      { q: "Who can use Zama’s open-source libraries?", a: ["AI & Web3 Developers", "Gamers", "Artists", "Marketers"], c: 0 },
      { q: "What does FHE allow?", a: ["Compute on encrypted data", "Decrypt before computing", "Faster data transfer", "Generate NFTs"], c: 0 },
      { q: "Which library helps integrate FHE with ML models?", a: ["Concrete ML", "TFHE.js", "ZamaNet", "CryptoFHE"], c: 0 },
      { q: "Zama’s primary mission is?", a: ["Bring privacy to AI & Web3", "Build a social network", "Sell cloud storage", "Create NFTs"], c: 0 },
      { q: "FHE stands for?", a: ["Fully Homomorphic Encryption", "Fast Hash Encoding", "Federated Homomorphic Engine", "Full Hardware Encryption"], c: 0 },
      { q: "Which Zama project is Python-based?", a: ["Concrete ML", "TFHE.rs", "ZamaJS", "MetaMask"], c: 0 },
      { q: "Which Zama library is written in Rust?", a: ["Concrete ML", "TFHE.rs", "PyFHE", "ZamaJS"], c: 1 },
      { q: "Concrete ML allows you to:", a: ["Train AI models on encrypted data", "Build NFTs", "Mine cryptocurrency", "Visualize blockchain"], c: 0 },
      { q: "Which of the following is NOT a Zama project?", a: ["TFHE.rs", "Concrete ML", "Concrete Core", "MetaMask"], c: 3 },
      { q: "What is the key benefit of FHE over traditional encryption?", a: ["Computation on encrypted data", "Cheaper transactions", "Faster storage", "Data compression"], c: 0 },
      { q: "Why might enterprises like Zama's tech?", a: ["Privacy for sensitive data", "Guaranteed profits", "Faster block confirmations", "Auto airdrops"], c: 0 },

      // --- NEW 5 (Season 5 / Creator Program related) ---
      { q: "What’s the main purpose of the Zama Creator Program (Season 5)?", a: ["To promote NFTs only", "To reward creators for quality content about Zama & FHE", "To launch Zama’s gaming platform", "To increase trading volume on exchanges"], c: 1 },
      { q: "Which of the following is NOT a reward in the Zama Creator Program S5?", a: ["Zama OG NFT", "Monthly prize pool", "Alpha access to Zama updates", "Free crypto trading signals"], c: 3 },
      { q: "What does Zama mainly focus on building?", a: ["Meme coins", "Layer-0 messaging chain", "Privacy tech using Fully Homomorphic Encryption", "Centralized blockchain explorer"], c: 2 },
      { q: "What is required to join Season 5 of the Zama Creator Program?", a: ["KYC verification", "Holding a Zama token", "Connecting wallet + following @zama + creating original posts", "Paying a registration fee"], c: 2 },
      { q: "Why is Zama considered unique in web3 right now?", a: ["It has the highest TPS among L1 chains", "It lets smart contracts run on encrypted data", "It offers guaranteed airdrops", "It uses AI to predict market movements"], c: 1 }
    ];

    // state
    let current = 0;
    let score = 0;
    const total = quizData.length;

    // elements
    const home = document.getElementById('home');
    const quiz = document.getElementById('quiz');
    const result = document.getElementById('result');
    const qTitle = document.getElementById('q-title');
    const optionsWrap = document.getElementById('options');
    const progressBar = document.getElementById('progressBar');
    const qcount = document.getElementById('qcount');
    const startBtn = document.getElementById('start-btn');
    const nextBtn = document.getElementById('nextBtn');
    const resultText = document.getElementById('resultText');
    const allAnswers = document.getElementById('allAnswers');
    const revealBtn = document.getElementById('revealBtn');
    const retryBtn = document.getElementById('retryBtn');

    // start
    startBtn.addEventListener('click', () => {
      home.style.display = 'none';
      quiz.style.display = 'block';
      current = 0; score = 0;
      renderQuestion();
    });

    function renderQuestion(){
      const item = quizData[current];
      qTitle.textContent = `Q${current+1}. ${item.q}`;
      optionsWrap.innerHTML = '';
      nextBtn.disabled = true;
      optionsWrap.dataset.selected = '';

      item.a.forEach((opt, idx) => {
        const b = document.createElement('button');
        b.className = 'option-btn';
        b.type = 'button';
        b.innerText = opt;
        b.addEventListener('click', () => {
          // select only, do NOT reveal correct answer now
          [...optionsWrap.children].forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
          optionsWrap.dataset.selected = idx;
          nextBtn.disabled = false;
        });
        optionsWrap.appendChild(b);
      });

      // update progress and count
      const pct = Math.round((current/total)*100);
      progressBar.style.width = pct + '%';
      qcount.innerText = `Question ${current+1} / ${total}`;
      // put Next button centered (already via CSS)
      nextBtn.onclick = handleNext;
    }

    function handleNext(){
      const sel = optionsWrap.dataset.selected;
      if(sel === '' || sel === undefined) return;
      const s = parseInt(sel,10);
      if(s === quizData[current].c) score++;
      current++;
      if(current < total) {
        renderQuestion();
        // scroll quiz into view on small screens for better UX
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResult();
      }
    }

    function showResult(){
      quiz.style.display = 'none';
      result.style.display = 'block';
      resultText.innerText = `Your Score: ${score} / ${total}`;
      // prepare answers but keep hidden until reveal
      allAnswers.innerHTML = '';
      quizData.forEach((q,i) => {
        const div = document.createElement('div');
        div.style.padding = '8px 0';
        div.innerHTML = `<strong>Q${i+1}.</strong> ${q.q}<br><strong>Answer:</strong> ${q.a[q.c]}`;
        allAnswers.appendChild(div);
      });
      allAnswers.style.display = 'none';
    }

    revealBtn.addEventListener('click', () => {
      if(allAnswers.style.display === 'none'){ allAnswers.style.display = 'block'; revealBtn.innerText = 'Hide Answers'; }
      else { allAnswers.style.display = 'none'; revealBtn.innerText = 'Show All Answers'; }
    });

    retryBtn.addEventListener('click', () => {
      result.style.display = 'none';
      home.style.display = 'block';
      // reset values
      current = 0; score = 0;
      progressBar.style.width = '0%';
    });

    // keyboard support: Enter triggers Next if available
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && quiz.style.display === 'block' && !nextBtn.disabled){
        handleNext();
      }
    });
  </script>
</body>
</html>
