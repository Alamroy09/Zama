<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zama S5 — FHE & OG NFT Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; background:linear-gradient(135deg,#0f172a,#3b82f6); color:white }
    .card { background: rgba(255,255,255,0.06); backdrop-filter: blur(6px); border-radius:16px; padding:28px; max-width:720px; width:92%; }
    .fade-in { animation: fadeIn .6s ease forwards } 
    @keyframes fadeIn { from {opacity:0; transform:translateY(12px)} to {opacity:1; transform:none} }
    .btn { cursor:pointer; border-radius:999px; padding:10px 20px; font-weight:600 }
    .primary { background:#f59e0b; color:#07112b }
    .option { transition: all .18s; }
    .option.selected { background:#2563eb; }
    .small { font-size:0.9rem; opacity:0.9 }
    .footer-badge { position:fixed; left:0; right:0; bottom:10px; display:flex; justify-content:center; pointer-events:none; }
    .answers-box { position:fixed; left:10px; bottom:60px; max-width:340px; }
  </style>
</head>
<body>

  <div class="card fade-in">
    <div id="home-screen">
      <h1 class="text-3xl font-bold mb-2">Zama S5 — Quick Quiz</h1>
      <p class="small mb-4">5 quick questions about the Zama Creator Program (Season 5) & OG NFT.</p>
      <button class="btn primary" onclick="startQuiz()">Start Quiz 🚀</button>
    </div>

    <div id="quiz-container" class="hidden">
      <div class="w-full bg-white/10 h-3 rounded-full mb-4">
        <div id="progress" class="bg-blue-400 h-3 rounded-full transition-all" style="width:0%"></div>
      </div>

      <h2 id="question" class="text-2xl font-semibold mb-3"></h2>
      <div id="options" class="space-y-3 mb-4"></div>

      <button id="next-btn" class="btn bg-white/10 px-4 py-2 rounded-full" disabled>Next ➡️</button>
    </div>

    <div id="result-screen" class="hidden text-center">
      <h2 class="text-2xl font-bold mb-2">Quiz Complete 🎉</h2>
      <p id="score-text" class="mb-4 small"></p>

      <div class="space-y-3">
        <button onclick="window.open('https://guild.xyz/zama/creator-program','_blank')" class="btn primary w-full">Join Zama Creator Program</button>
        <button id="show-answers" class="btn w-full" style="background:#ef4444">Show Correct Answers</button>
        <button id="restart" class="btn w-full" style="background:#1f2937; color:white">Restart</button>
      </div>

      <div id="answers-area" class="mt-4 text-left hidden bg-white/10 p-3 rounded-lg max-h-64 overflow-y-auto small"></div>
    </div>
  </div>

  <div class="footer-badge">
    <div style="background:rgba(255,255,255,0.04); color:white; padding:8px 12px; border-radius:999px; font-size:0.9rem; pointer-events:auto;">Build by Rubel</div>
  </div>

  <script>
    const quizData = [
      {
        q: "What’s the main purpose of the Zama Creator Program (Season 5)?",
        a: [
          "To promote NFTs only",
          "To reward creators for quality content about Zama & FHE",
          "To launch Zama’s gaming platform",
          "To increase trading volume on exchanges"
        ],
        c: 1
      },
      {
        q: "Which of the following is not a reward in the Zama Creator Program S5?",
        a: [
          "Zama OG NFT",
          "Monthly prize pool",
          "Alpha access to Zama updates",
          "Free crypto trading signals"
        ],
        c: 3
      },
      {
        q: "What does Zama mainly focus on building?",
        a: [
          "Meme coins",
          "Layer-0 messaging chain",
          "Privacy tech using Fully Homomorphic Encryption",
          "Centralized blockchain explorer"
        ],
        c: 2
      },
      {
        q: "What is required to join Season 5 of the Zama Creator Program?",
        a: [
          "KYC verification",
          "Holding a Zama token",
          "Connecting wallet + following @zama + creating original posts",
          "Paying a registration fee"
        ],
        c: 2
      },
      {
        q: "Why is Zama considered unique in web3 right now?",
        a: [
          "It has the highest TPS among L1 chains",
          "It lets smart contracts run on encrypted data",
          "It offers guaranteed airdrops",
          "It uses AI to predict market movements"
        ],
        c: 1
      }
    ];

    let current = 0, score = 0;

    const home = document.getElementById('home-screen');
    const quizContainer = document.getElementById('quiz-container');
    const result = document.getElementById('result-screen');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const progressEl = document.getElementById('progress');
    const answersArea = document.getElementById('answers-area');

    function startQuiz(){
      home.classList.add('hidden');
      result.classList.add('hidden');
      quizContainer.classList.remove('hidden');
      current = 0; score = 0; loadQuestion();
    }

    function loadQuestion(){
      const q = quizData[current];
      questionEl.textContent = `Q${current+1}. ${q.q}`;
      optionsEl.innerHTML = '';
      nextBtn.disabled = true;

      q.a.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option block w-full text-left px-4 py-3 bg-white/5 rounded-lg';
        btn.textContent = opt;
        btn.onclick = () => {
          [...optionsEl.children].forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          optionsEl.dataset.selected = i;
          nextBtn.disabled = false;
        };
        optionsEl.appendChild(btn);
      });

      progressEl.style.width = `${(current/quizData.length)*100}%`;
    }

    nextBtn.onclick = () => {
      const selected = parseInt(optionsEl.dataset.selected);
      if(selected === quizData[current].c) score++;
      current++;
      if(current < quizData.length) loadQuestion();
      else showResult();
    };

    function showResult(){
      quizContainer.classList.add('hidden');
      result.classList.remove('hidden');
      answersArea.classList.add('hidden');
      scoreText.textContent = `Your Score: ${score} / ${quizData.length}`;
    }

    document.getElementById('show-answers').onclick = () => {
      answersArea.innerHTML = '';
      quizData.forEach((q, idx) => {
        const div = document.createElement('div');
        div.innerHTML = `<strong>Q${idx+1}:</strong> ${q.q}<br><strong>Answer:</strong> ${q.a[q.c]}<hr class='my-2 border-white/20'>`;
        answersArea.appendChild(div);
      });
      answersArea.classList.toggle('hidden');
    };

    document.getElementById('restart').onclick = startQuiz;
  </script>

</body>
</html>
